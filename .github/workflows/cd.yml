name: CD

# Deliberately triggered by the CI workflow *completing successfully* on
# main, rather than independently on push — this is what "passing CI on
# main gates a production deploy" (ANSWERS.md Part D3) actually looks like
# as a mechanism, not just a sentence in a doc. A push to main that fails
# CI can never reach this workflow at all.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push image to GHCR
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tags=$IMAGE:$SHA,$IMAGE:latest" >> "$GITHUB_OUTPUT"

      # Tagged with the git SHA (not just :latest) specifically so the
      # rollback story in ANSWERS.md D1/D3 ("redeploy the previous image")
      # is a concrete, addressable artifact rather than a hope that the
      # registry still has an older layer cached somewhere.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Run migrations against production
    needs: build-and-push
    runs-on: ubuntu-latest
    # A GitHub Environment named "production" — configure required
    # reviewers on it in Settings -> Environments to get a manual approval
    # gate here before anything touches the production database. This is
    # also where PRODUCTION_* secrets referenced below live.
    environment: production
    steps:
      - name: Run the one-off migration step
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "::warning::PRODUCTION_SSH_HOST is not configured — skipping the real migration step."
            echo "Configure secrets.PRODUCTION_SSH_HOST / _SSH_USER / _SSH_KEY (or swap this step"
            echo "for an 'aws ecs run-task' one-off job if deploying to ECS instead of a single EC2"
            echo "host) to make this step do something real. See README 'CI/CD' section."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "cd artikate-checkout && docker compose pull web && \
             docker compose run --rm web python manage.py migrate --noinput"

  deploy:
    name: Deploy new image
    needs: [build-and-push, migrate]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Roll the new image out
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "::warning::PRODUCTION_SSH_HOST is not configured — skipping the real deploy step."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "cd artikate-checkout && docker compose pull && docker compose up -d"

      - name: Smoke test /health/
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "::notice::No production host configured; nothing to smoke test yet."
            exit 0
          fi
          for i in $(seq 1 10); do
            if curl -sf "$HEALTH_URL"; then
              echo "Health check passed."
              exit 0
            fi
            echo "Health check not ready yet, retrying..."
            sleep 3
          done
          echo "::error::Health check never passed after deploy — this deploy should be treated as failed."
          exit 1
